<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>ПДД Коннектикута</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ПДД CT"><link rel="apple-touch-icon" href="icon.png"><meta name="theme-color" content="#0b6b3a">
<style>
:root{--bg:#f3f5f1;--card:#fff;--ink:#16211b;--mute:#5d6b62;--g:#0b6b3a;--gt:#fff;--ok:#dff3e6;--okb:#1f8a4c;--bad:#fbe3e6;--badb:#c8102e;--line:#d9dfd9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--card:#18211c;--ink:#e8efe9;--mute:#9aa99f;--g:#2f8f5b;--ok:#17402a;--okb:#4cc380;--bad:#47181f;--badb:#ff6b7f;--line:#2a372f}}
:root[data-theme="dark"]{--bg:#101613;--card:#18211c;--ink:#e8efe9;--mute:#9aa99f;--g:#2f8f5b;--ok:#17402a;--okb:#4cc380;--bad:#47181f;--badb:#ff6b7f;--line:#2a372f}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--g);color:var(--gt);padding:14px 16px 10px}
header h1{margin:0 0 8px;font-size:20px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{flex:1;min-width:70px;border:0;border-radius:8px;padding:8px 6px;font:inherit;font-size:14px;background:rgba(255,255,255,.18);color:var(--gt)}
nav button.on{background:#fff;color:#0b6b3a;font-weight:600}
main{max-width:560px;margin:0 auto;padding:16px}
h2{font-size:19px;line-height:1.35;margin:6px 0 14px}
.mute{color:var(--mute);font-size:14px;margin:0}
.opt,.go{display:block;width:100%;text-align:left;margin:0 0 8px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.go{background:var(--g);color:var(--gt);border-color:var(--g);text-align:center;font-weight:600;margin-top:10px}
.opt.ok{background:var(--ok);border-color:var(--okb)}.opt.bad{background:var(--bad);border-color:var(--badb)}
.exp{padding:10px 12px;border-left:4px solid var(--g);background:var(--card);border-radius:6px;margin-top:6px}
.card{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.card svg{flex:none}.card b{display:block}
.big{font-size:44px;font-weight:700;margin:0}
.qi{display:block;margin:0 auto 12px;width:120px;height:120px;object-fit:contain;background:#fff;border-radius:10px;padding:6px}.card img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:8px;padding:3px}
button:focus-visible{outline:3px solid #f5c400;outline-offset:2px}
</style></head><body>
<header><h1>ПДД Коннектикута</h1><nav id="nav"></nav></header>
<main id="app"></main>

const Q=[
['Услышав сирену экстренной службы, откуда бы она ни ехала, нужно:',['Притормозить','Прижаться к правому краю и остановиться','Ехать с той же скоростью','Ускориться'],1,'Остановитесь у правого края и ждите, пока машина проедет. Если вы на перекрёстке, сначала проедьте его.'],
['«No-Zone» (зона риска) — это:',['Место, где пешеходам нельзя переходить','Место, где нельзя парковаться','Слепые зоны вокруг грузовика','Ничего из перечисленного'],2,'Это опасные зоны вокруг грузовика, где водитель вас не видит.'],
['На перекрёстке с четырьмя знаками STOP (four-way stop):',['Первым едет тот, кто слева','Можно не останавливаться, если рядом никого нет','Первым едет тот, кто приехал первым; при одновременном — тот, что справа','Первыми едут школьные автобусы'],2,'Остановитесь полностью. Кто приехал первым, тот и едет; если одновременно, уступите тому, кто справа.'],
['При перестроении нужно:',['Посмотреть через плечо в сторону манёвра','Посигналить','Пересечь сразу две полосы','Мигнуть фарами'],0,'Зеркала не показывают слепую зону, поэтому посмотрите через плечо.'],
['Встречная машина не переключила дальний свет. Что делать?',['Смотреть в центр дороги','Быстро мигнуть фарами пару раз','Оставить дальний свет','Выключить фары'],1,'Мигните пару раз. Если не помогло, смотрите на правый край дороги, чтобы не ослепнуть.'],
['Знак-пятиугольник (pentagon) означает:',['Железнодорожный переезд','Запрет обгона','Школьная зона','Уступи дорогу'],2,'Пятиугольник — школьная зона и школьный переход.'],
['Зелёные знаки — это:',['Запрещающие (regulatory)','Указательные (guide)','Предупреждающие (warning)','Только для парков'],1,'Зелёный — указатели: где вы, куда ехать, расстояние. Парки — коричневый.'],
['Сплошная жёлтая линия между полосами означает:',['Обгон разрешён только с одной стороны','Можно менять полосу','Обгон запрещён','Ничего из перечисленного'],2,'Так в учебнике. Если рядом пунктирная жёлтая, обгон разрешён со стороны пунктирной.'],
['Восьмиугольник (octagon) всегда означает:',['Уступи дорогу','Остановку','Школу','Опасность'],1,'STOP: полная остановка у знака или стоп-линии, затем уступите тем, у кого право проезда.'],
['Красно-белый треугольник вершиной вниз:',['STOP','Уступи дорогу (yield)','Въезд запрещён','Парковка'],1,'Yield: сбавьте скорость и уступите, а если нужно, остановитесь.'],
['Круглый знак предупреждает о:',['Школе','Ремонте дороги','Железнодорожном переезде','Парке'],2,'Круг — railroad crossing. Сбавьте скорость, смотрите и слушайте.'],
['Знак-вымпел (трёхугольный, слева от дороги) означает:',['Зону запрета обгона','Школу','Переезд','Уступи дорогу'],0,'Pennant — No Passing Zone. Стоит слева на двухполосной дороге.'],
['Оранжевые знаки предупреждают о:',['Парках','Дорожных работах (construction)','Услугах','Школах'],1,'Оранжевый — ремонт и обслуживание дороги.'],
['Коричневые знаки обозначают:',['Парки и места отдыха','Услуги','Запреты','Школы'],0,'Brown — parks and recreation.'],
['Синие знаки сообщают:',['Об опасности','Об услугах вдоль дороги','О ремонте','О запрете остановки'],1,'Blue — услуги (заправки, больницы).'],
['Красный сигнал светофора. Правый поворот на красный:',['Всегда запрещён','Разрешён после полной остановки, если нет движения и запрещающего знака','Разрешён без остановки','Только ночью'],1,'Остановитесь, убедитесь, что поворот не запрещён, и уступите пешеходам.'],

['Мигающий жёлтый сигнал означает:',['Остановиться','Сбавить скорость и ехать осторожно','Уступить и стоять','Дорога закрыта'],1,'Slow down and proceed with caution.'],
['Вы уже на перекрёстке, и загорелся жёлтый. Что делать?',['Остановиться на месте','Сдать назад','Продолжить и проехать перекрёсток','Посигналить'],2,'Если вы уже в перекрёстке, не останавливайтесь.'],
['У школьного автобуса мигают красные огни. Вы должны:',['Объехать','Остановиться, даже если автобус на встречной полосе','Остановиться только на своей стороне','Сбавить скорость'],1,'Стоять нужно и на своей, и на встречной стороне. Исключение: проезжие части разделены барьером или разделительной полосой (median).'],

['Сухая дорога, хорошие шины. Тормозной путь с реакцией при 50 миль/ч — около:',['100 футов','200 футов','400 футов','800 футов'],2,'При 50 mph около 400 футов, при 30 mph около 200 футов.'],
['Въезжая на кольцо (roundabout), нужно:',['Ехать первым','Уступить тем, кто уже на кольце','Остановиться внутри кольца','Включить дальний свет'],1,'Уступайте движущимся по кольцу и пешеходам на переходе.'],
['Пешеход на переходе (crosswalk), размеченном или нет:',['Должен уступать машинам','Имеет преимущество: водитель обязан уступить','Должен ждать зелёного','Не имеет преимущества'],1,'Водители обязаны уступать пешеходам на размеченном и неразмеченном переходе.'],
['При левом повороте вы обязаны уступить:',['Попутным машинам','Встречным машинам, едущим прямо','Никому','Только автобусам'],1,'Turning left must yield to oncoming vehicles going straight.'],
['Если включены дворники, то фары:',['Можно не включать','Нужно включить — это закон','Только ночью','Только на трассе'],1,'Wipers on = headlights on.']

SG.forEach((s,i)=>{const o=shuf2(SG.filter((_,j)=>j!=i).map(x=>x[1])).slice(0,3),a=shuf2([s[1],...o]);SQ.push(Q.length);Q.push(['Что означает этот знак?',a,a.indexOf(s[1]),s[2],s[0]])});
function shuf2(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1])}
const EX=['Остановитесь полностью у знака или стоп-линии, посмотрите по сторонам и уступите тем, у кого право проезда. Запомнить: восьмиугольник всегда означает STOP.','Сбавьте скорость и уступите дорогу; если есть движение, остановитесь. Запомнить: вершина вниз, красная кайма.','Сюда въезжать нельзя: по этой дороге едут навстречу. Запомнить: красный круг с белой полосой.','Вы едете против движения. Остановитесь и безопасно выезжайте обратно.','Разворот запрещён. Красный перечёркнутый круг всегда означает «нельзя».','Поворачивать направо нельзя. Стрелка внутри показывает, что именно запрещено.','Держитесь правее препятствия или разделителя. Стрелка показывает, с какой стороны объезжать.','На этом участке обгонять нельзя.','Парковка только для машин с разрешением для людей с инвалидностью. Без разрешения здесь парковаться нельзя.','Максимально разрешённая скорость на этом участке, в милях в час (mph).','Впереди светофор. Следите за сигналом и будьте готовы остановиться.','Впереди пешеходный переход. Сбавьте скорость и уступайте пешеходам.','Дальше движение двустороннее: встречные машины едут по соседней полосе. Держитесь своей стороны.','Рядом школа или школьный переход. Сбавьте скорость и будьте готовы остановиться. Запомнить: пятиугольник — школа.','Дорога может быть скользкой. Сбавьте скорость и не тормозите резко.','Здесь обгон запрещён. Запомнить: вымпел стоит слева от дороги и указывает на неё.','Полосы сливаются. Следите за соседними машинами и перестраивайтесь плавно.','Безопасная скорость для следующего участка, например поворота. Это рекомендация, но лучше её придерживаться.','Впереди знак STOP. Начинайте притормаживать заранее.','Дальше дорога разделена на два направления. Встречные машины будут по другую сторону разделителя.','Резкий поворот: стрелка показывает направление. Сбавьте скорость до поворота.','Впереди пересечение дорог. Будьте готовы уступить или остановиться.','Дорога впереди заканчивается: нужно повернуть налево или направо.','Дорога впереди раздваивается. Заранее выберите нужную полосу.','Щит межштатной магистрали (Interstate). По форме щита видно, какого типа эта дорога.','Щит федеральной трассы (U.S. Route) с номером дороги.','Парк или место отдыха. Запомнить: коричневый цвет — природа и отдых.','Зона отдыха, где можно остановиться. Синие знаки сообщают об услугах: заправки, еда, больницы.','Зелёный указатель: названия городов и расстояние до них.','Впереди дорожные работы. Сбавьте скорость: рабочие могут быть рядом с дорогой.','Объезд: стрелка показывает, куда поворачивать, пока основная дорога закрыта.','Впереди флагман, который регулирует движение. Выполняйте его сигналы.','Впереди железнодорожный переезд. Сбавьте скорость, смотрите и слушайте, будьте готовы остановиться.','Этот знак стоит прямо у путей. Если приближается поезд, остановитесь и уступите ему.'];
const GT=[{n:'Формы и цвета',a:-1,x:[5,6,8,9,10,11,12,13,14],t:'Знак можно узнать, даже не читая надпись: сначала смотрите на форму, потом на цвет. Восьмиугольник — всегда STOP, перевёрнутый треугольник — Yield (уступи), ромб — предупреждение об опасности, круг — железнодорожный переезд, пятиугольник — школа. Цвета: красный — стоп и запреты, жёлтый — предупреждение, оранжевый — дорожные работы, зелёный — указатели, синий — услуги, коричневый — парки и отдых. В учебнике знаки чёрно-белые, здесь цвета добавлены по стандарту США.'},
{n:'Регулирующие знаки (Regulatory)',a:0,b:9,x:[],t:'Это знаки-правила: их нужно выполнять. Они требуют остановиться, уступить, не въезжать, не поворачивать, не обгонять или не превышать скорость. Красный цвет — самые строгие требования (STOP, Yield, въезд запрещён), остальные чаще чёрно-белые.'},
{n:'Предупреждающие знаки (Warning)',a:10,b:23,x:[],t:'Они предупреждают об опасности впереди: поворот, перекрёсток, скользкая дорога, пешеходы. Обычно это жёлтый ромб (школьный знак — пятиугольник). Увидели такой знак — сбавьте скорость и будьте внимательнее.'},
{n:'Указатели и услуги (Guide)',a:24,b:28,x:[6,13,14],t:'Эти знаки помогают ориентироваться: куда ехать, сколько до города, где зона отдыха или заправка. Зелёные знаки — указатели, синие — услуги, коричневые — парки и места отдыха. Номер дороги показывает щит: у Interstate и U.S. Route форма разная.'},
{n:'Дорожные работы и переезды',a:29,b:33,x:[10,12],t:'Оранжевый цвет — работы на дороге: сбавьте скорость, будьте готовы к объезду и к рабочим. Перед железнодорожным переездом стоит круглый жёлтый знак, а белый крест Railroad Crossing стоит прямо у путей: поезду нужно уступить.'}];
let D=[];try{D=JSON.parse(localStorage.getItem('d')||'[]')}catch(e){}
function grp(){app.innerHTML='<h2>Темы</h2><p class="mute">Сначала теория, потом проверка: знаки и правила.</p>'+GT.map((g,i)=>`<button class="opt" onclick="gv(${i})">${D.includes(i)?'✓ ':''}${i+1}. ${g.n}<br><span class="mute">${pg(g)}</span></button>`).join('')}
function gv(i){const g=GT[i],c=s=>`<div class="card"><img src="${s[0]}" alt=""><div><b>${s[1]}</b><span class="mute">${s[2]}</span></div></div>`;
const L=g.r?[]:g.a<0?SH.map(c):SG.slice(g.a,g.b+1).map((s,j)=>c([s[0],s[1],EX[g.a+j]]));
app.innerHTML=`<p class="mute"><a href="#" onclick="grp();return false">← Все темы</a></p><h2>${g.n}</h2><p class="mute">${pg(g)}</p><div class="exp">${g.t}</div><br>`+L.join('')+`<button class="go" onclick="gq(${i})">Проверить себя</button>`;window.scrollTo(0,0)}
function gq(i){const g=GT[i];start(shuf(g.r?g.ids:(g.a<0?[]:SQ.slice(g.a,g.b+1)).concat(g.x)).slice(0,g.r?g.ids.length:6),0);S.g=i}
const QI={5:13,6:28,8:0,9:1,10:32,11:15,12:29,13:26,14:27,23:11};
let C={};try{C=JSON.parse(localStorage.getItem('c')||'{}')}catch(e){}
const sc=()=>{try{localStorage.setItem('c',JSON.stringify(C))}catch(e){}};
const CD=[...SH.map((s,i)=>({id:'h'+i,img:s[0],q:'Что означает эта форма знака?',a:s[1],b:s[2]})),...SG.map((s,i)=>({id:'s'+i,img:s[0],q:'Что это за знак?',a:s[1],b:EX[i]}))];
let CQ=[],CF=false;
function cards(){const n=Date.now();CQ=shuf(CD.filter(c=>C[c.id]&&C[c.id].d<=n)).concat(nw());CF=false;card()}
function card(){if(!CQ.length){const n=Object.values(C).map(x=>x.d).filter(d=>d>Date.now()),nx=n.length?Math.min(...n):0;
app.innerHTML=`<h2>На сегодня всё</h2><p class="mute">${nx?'Следующая карточка будет готова '+new Date(nx).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}</p><button class="go" onclick="cards()">Проверить ещё раз</button>`;return}
const c=CQ[0];app.innerHTML=`<p class="mute">Осталось карточек: ${CQ.length}</p>${c.img?`<img class="qi" src="${c.img}" alt="">`:''}<h2>${c.q}</h2>`+(CF?`<div class="exp"><b>${c.a}</b><br>${c.b}</div><p class="mute">Насколько хорошо вы это знали?</p>${bt(c)}`:`<button class="go" onclick="CF=true;card()">Показать ответ</button>`)}
function rate(r){const c=CQ.shift(),o=C[c.id]||{s:0},n=Date.now();
if(r==0){o.s=0;o.d=n+3e5;CQ.splice(Math.min(2,CQ.length),0,c)}
else if(r==1){o.s=0;o.d=n+6e4;CQ.splice(Math.min(5,CQ.length),0,c)}
else if(r==2)o.d=n+36e5;
else if(r==3)o.d=n+864e5;
else{o.s=(o.s||0)+1;o.d=n+[2,4,7,14,30][Math.min(o.s-1,4)]*864e5}
C[c.id]=o;sc();CF=false;card()}

{n:'Скорость и торможение',t:'Ограничение скорости рассчитано на хорошие условия. Если дорога мокрая или скользкая, видно плохо или много машин, нужно ехать медленнее: оштрафовать могут и при разрешённой скорости, если она слишком высока для условий. Тормозной путь растёт быстрее скорости: при 60 миль/ч он больше чем втрое длиннее, чем при 30. На сухой дороге с хорошими шинами при 50 миль/ч нужно около 400 футов (≈120 м), при 30 миль/ч около 200 футов (≈60 м). Слишком медленная езда тоже опасна: если за вами собралась колонна, пропустите её, когда это безопасно.',q:[

{n:'Право проезда и перекрёстки',t:'Закон определяет, кто должен уступить, но никому не даёт права проезда: избежать столкновения должен каждый. Пешеходам на переходе (размеченном или нет) уступают всегда. При левом повороте уступаете встречным, которые едут прямо. На кольце уступаете тем, кто уже на нём. Без знаков уступаете тому, кто справа. При выезде со двора или с обочины уступаете машинам на главной дороге. На перекрёстке с четырьмя знаками STOP после полной остановки первым едет тот, кто приехал раньше, а при одновременном приезде тот, кто справа. Школьному автобусу с красными мигающими огнями уступают с любой стороны (если дорога не разделена барьером), экстренным службам с сиреной тоже: съехать вправо и остановиться, а если вы на перекрёстке, сначала проехать его.',q:[

['Вы въезжаете на кольцо (roundabout). Кому нужно уступить?',['Тем, кто въедет позже вас','Тем, кто уже едет по кольцу, и пешеходам на переходе','Только пешеходам','Никому'],1,'Въезжающие уступают движущимся по кольцу. Останавливаться внутри кольца нельзя.'],

{n:'Парковка',t:'Паркуйтесь только там, где вы не мешаете движению. Нельзя парковаться: ближе 10 футов (≈3 м) к пожарному гидранту; ближе 25 футов (≈7,6 м) к знаку STOP и к пешеходной зоне безопасности; на перекрёстке, пешеходном переходе, тротуаре, мосту, в тоннеле, на рельсах и в велодорожке; перед въездом во двор; на месте для людей с инвалидностью без разрешения; рядом с уже припаркованной машиной (двойная парковка); дальше одного фута от бордюра. На склоне поверните колёса так, чтобы машина покатилась прочь от дороги. Не оставляйте ключи в машине и ставьте её на стояночный тормоз.',q:[

{n:'Фары, сигналы и клаксон',t:'Если включены дворники, включите и фары: это закон. Габаритные огни (parking lights) только для стоянки. Дальний свет используйте, когда нет встречных машин; переключайтесь на ближний примерно за квартал до встречной машины, когда едете за другой машиной, в тумане и сильный дождь. Если встречный водитель не переключил дальний, мигните фарами пару раз, а потом смотрите на правый край дороги. Поворотник включайте минимум за 3 секунды до манёвра, но не слишком рано, если до поворота есть другие въезды. Если нужно резко замедлиться там, где этого не ждут, быстро нажмите на тормоз 3–4 раза. Клаксон: лёгкое нажатие, чтобы привлечь внимание, резкий сигнал при настоящей опасности. Не сигнальте слепым пешеходам и лошадям.',q:[

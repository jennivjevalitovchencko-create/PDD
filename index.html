<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>ПДД Коннектикута</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ПДД CT"><link rel="apple-touch-icon" href="icon.png"><meta name="theme-color" content="#0b6b3a">
<style>
:root{--bg:#f3f5f1;--card:#fff;--ink:#16211b;--mute:#5d6b62;--g:#0b6b3a;--gt:#fff;--ok:#dff3e6;--okb:#1f8a4c;--bad:#fbe3e6;--badb:#c8102e;--line:#d9dfd9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--card:#18211c;--ink:#e8efe9;--mute:#9aa99f;--g:#2f8f5b;--ok:#17402a;--okb:#4cc380;--bad:#47181f;--badb:#ff6b7f;--line:#2a372f}}
:root[data-theme="dark"]{--bg:#101613;--card:#18211c;--ink:#e8efe9;--mute:#9aa99f;--g:#2f8f5b;--ok:#17402a;--okb:#4cc380;--bad:#47181f;--badb:#ff6b7f;--line:#2a372f}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--g);color:var(--gt);padding:14px 16px 10px}
header h1{margin:0 0 8px;font-size:20px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{flex:1;min-width:70px;border:0;border-radius:8px;padding:8px 6px;font:inherit;font-size:14px;background:rgba(255,255,255,.18);color:var(--gt)}
nav button.on{background:#fff;color:#0b6b3a;font-weight:600}
main{max-width:560px;margin:0 auto;padding:16px}
h2{font-size:19px;line-height:1.35;margin:6px 0 14px}
.mute{color:var(--mute);font-size:14px;margin:0}
.opt,.go{display:block;width:100%;text-align:left;margin:0 0 8px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.go{background:var(--g);color:var(--gt);border-color:var(--g);text-align:center;font-weight:600;margin-top:10px}
.opt.ok{background:var(--ok);border-color:var(--okb)}.opt.bad{background:var(--bad);border-color:var(--badb)}
.exp{padding:10px 12px;border-left:4px solid var(--g);background:var(--card);border-radius:6px;margin-top:6px}
.card{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.card svg{flex:none}.card b{display:block}
.big{font-size:44px;font-weight:700;margin:0}
.qi{display:block;margin:0 auto 12px;width:120px;height:120px;object-fit:contain;background:#fff;border-radius:10px;padding:6px}.card img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:8px;padding:3px}
:root{--t1b:#FBEAF0;--t1x:#72243E;--t2b:#EAF3DE;--t2x:#27500A;--t3b:#E6F1FB;--t3x:#0C447C;--t4b:#FAEEDA;--t4x:#633806;--t5b:#EEEDFE;--t5x:#3C3489;--t6b:#E1F5EE;--t6x:#085041}
:root[data-theme="dark"]{--t1b:#4B1528;--t1x:#F4C0D1;--t2b:#173404;--t2x:#C0DD97;--t3b:#042C53;--t3x:#B5D4F4;--t4b:#412402;--t4x:#FAC775;--t5b:#26215C;--t5x:#CECBF6;--t6b:#04342C;--t6x:#9FE1CB}
header{display:none}main{padding-bottom:96px}
.tl{border-radius:18px;padding:12px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}.tl b{font-size:15px;display:block;line-height:1.2}.tl span{font-size:12px;opacity:.85;display:block;margin-top:2px}
#bb{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
#bb button{background:none;border:0;color:var(--mute);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 14px}#bb button span{font-size:22px}#bb button.on{color:#e24b4a}
button:focus-visible{outline:3px solid #f5c400;outline-offset:2px}
</style></head><body>

const Q=[
['Услышав сирену экстренной службы, откуда бы она ни ехала, нужно:',['Притормозить','Прижаться к правому краю и остановиться','Ехать с той же скоростью','Ускориться'],1,'Остановитесь у правого края и ждите, пока машина проедет. Если вы на перекрёстке, сначала проедьте его.'],
['«No-Zone» (зона риска) — это:',['Место, где пешеходам нельзя переходить','Место, где нельзя парковаться','Слепые зоны вокруг грузовика','Ничего из перечисленного'],2,'Это опасные зоны вокруг грузовика, где водитель вас не видит.'],
['На перекрёстке с четырьмя знаками STOP (four-way stop):',['Первым едет тот, кто слева','Можно не останавливаться, если рядом никого нет','Первым едет тот, кто приехал первым; при одновременном — тот, что справа','Первыми едут школьные автобусы'],2,'Остановитесь полностью. Кто приехал первым, тот и едет; если одновременно, уступите тому, кто справа.'],
['При перестроении нужно:',['Посмотреть через плечо в сторону манёвра','Посигналить','Пересечь сразу две полосы','Мигнуть фарами'],0,'Зеркала не показывают слепую зону, поэтому посмотрите через плечо.'],
['Встречная машина не переключила дальний свет. Что делать?',['Смотреть в центр дороги','Быстро мигнуть фарами пару раз','Оставить дальний свет','Выключить фары'],1,'Мигните пару раз. Если не помогло, смотрите на правый край дороги, чтобы не ослепнуть.'],
['Знак-пятиугольник (pentagon) означает:',['Железнодорожный переезд','Запрет обгона','Школьная зона','Уступи дорогу'],2,'Пятиугольник — школьная зона и школьный переход.'],
['Зелёные знаки — это:',['Запрещающие (regulatory)','Указательные (guide)','Предупреждающие (warning)','Только для парков'],1,'Зелёный — указатели: где вы, куда ехать, расстояние. Парки — коричневый.'],
['Сплошная жёлтая линия между полосами означает:',['Обгон разрешён только с одной стороны','Можно менять полосу','Обгон запрещён','Ничего из перечисленного'],2,'Так в учебнике. Если рядом пунктирная жёлтая, обгон разрешён со стороны пунктирной.'],
['Восьмиугольник (octagon) всегда означает:',['Уступи дорогу','Остановку','Школу','Опасность'],1,'STOP: полная остановка у знака или стоп-линии, затем уступите тем, у кого право проезда.'],
['Красно-белый треугольник вершиной вниз:',['STOP','Уступи дорогу (yield)','Въезд запрещён','Парковка'],1,'Yield: сбавьте скорость и уступите, а если нужно, остановитесь.'],
['Круглый знак предупреждает о:',['Школе','Ремонте дороги','Железнодорожном переезде','Парке'],2,'Круг — railroad crossing. Сбавьте скорость, смотрите и слушайте.'],
['Знак-вымпел (трёхугольный, слева от дороги) означает:',['Зону запрета обгона','Школу','Переезд','Уступи дорогу'],0,'Pennant — No Passing Zone. Стоит слева на двухполосной дороге.'],
['Оранжевые знаки предупреждают о:',['Парках','Дорожных работах (construction)','Услугах','Школах'],1,'Оранжевый — ремонт и обслуживание дороги.'],
['Коричневые знаки обозначают:',['Парки и места отдыха','Услуги','Запреты','Школы'],0,'Brown — parks and recreation.'],
['Синие знаки сообщают:',['Об опасности','Об услугах вдоль дороги','О ремонте','О запрете остановки'],1,'Blue — услуги (заправки, больницы).'],
['Красный сигнал светофора. Правый поворот на красный:',['Всегда запрещён','Разрешён после полной остановки, если нет движения и запрещающего знака','Разрешён без остановки','Только ночью'],1,'Остановитесь, убедитесь, что поворот не запрещён, и уступите пешеходам.'],
['Мигающий красный сигнал означает:',['Сбавить скорость','То же, что знак STOP','Дорога закрыта','Можно ехать'],1,'Полная остановка, затем поезжайте, когда безопасно.'],
['Мигающий жёлтый сигнал означает:',['Остановиться','Сбавить скорость и ехать осторожно','Уступить и стоять','Дорога закрыта'],1,'Slow down and proceed with caution.'],
['Вы уже на перекрёстке, и загорелся жёлтый. Что делать?',['Остановиться на месте','Сдать назад','Продолжить и проехать перекрёсток','Посигналить'],2,'Если вы уже в перекрёстке, не останавливайтесь.'],
['У школьного автобуса мигают красные огни. Вы должны:',['Объехать','Остановиться, даже если автобус на встречной полосе','Остановиться только на своей стороне','Сбавить скорость'],1,'Стоять нужно и на своей, и на встречной стороне. Исключение: проезжие части разделены барьером или разделительной полосой (median).'],
['Парковаться нельзя ближе чем:',['10 футов (≈3 м) до пожарного гидранта','5 футов до гидранта','50 футов до знака STOP','Парковаться можно везде'],0,'10 футов до гидранта и 25 футов (≈7,6 м) до знака STOP.'],
['Сухая дорога, хорошие шины. Тормозной путь с реакцией при 50 миль/ч — около:',['100 футов','200 футов','400 футов','800 футов'],2,'При 50 mph около 400 футов, при 30 mph около 200 футов.'],
['Въезжая на кольцо (roundabout), нужно:',['Ехать первым','Уступить тем, кто уже на кольце','Остановиться внутри кольца','Включить дальний свет'],1,'Уступайте движущимся по кольцу и пешеходам на переходе.'],
['Пешеход на переходе (crosswalk), размеченном или нет:',['Должен уступать машинам','Имеет преимущество: водитель обязан уступить','Должен ждать зелёного','Не имеет преимущества'],1,'Водители обязаны уступать пешеходам на размеченном и неразмеченном переходе.'],
['При левом повороте вы обязаны уступить:',['Попутным машинам','Встречным машинам, едущим прямо','Никому','Только автобусам'],1,'Turning left must yield to oncoming vehicles going straight.'],
['Если включены дворники, то фары:',['Можно не включать','Нужно включить — это закон','Только ночью','Только на трассе'],1,'Wipers on = headlights on.']
];

const EX=['Остановитесь полностью у знака или стоп-линии, посмотрите по сторонам и уступите тем, у кого право проезда. Запомнить: восьмиугольник всегда означает STOP.','Сбавьте скорость и уступите дорогу; если есть движение, остановитесь. Запомнить: вершина вниз, красная кайма.','Въезд запрещён.','Вы едете против движения. Остановитесь и безопасно выезжайте обратно.','Разворот запрещён. Красный перечёркнутый круг всегда означает «нельзя».','Поворачивать направо нельзя. Стрелка внутри показывает, что именно запрещено.','Держитесь правее препятствия или разделителя. Стрелка показывает, с какой стороны объезжать.','На этом участке обгонять нельзя.','Парковка только для машин с разрешением для людей с инвалидностью. Без разрешения здесь парковаться нельзя.','Максимально разрешённая скорость на этом участке, в милях в час (mph).','Впереди светофор. Следите за сигналом и будьте готовы остановиться.','Впереди пешеходный переход. Сбавьте скорость и уступайте пешеходам.','Вы покидаете разделённую дорогу: дальше движение двустороннее, встречные машины едут по соседней полосе. Держитесь своей стороны.','Рядом школа или школьный переход. Сбавьте скорость и будьте готовы остановиться. Запомнить: пятиугольник — школа.','Дорога может быть скользкой. Сбавьте скорость и не тормозите резко.','Здесь обгон запрещён. Запомнить: вымпел стоит слева от дороги и указывает на неё.','Полосы сливаются. Следите за соседними машинами и перестраивайтесь плавно.','Безопасная скорость для следующего участка, например поворота. Это рекомендация, но лучше её придерживаться.','Впереди знак STOP. Начинайте притормаживать заранее.','Дальше дорога разделена на два направления. Встречные машины будут по другую сторону разделителя.','Резкий поворот: стрелка показывает направление. Сбавьте скорость до поворота.','Впереди пересечение дорог. Будьте готовы уступить или остановиться.','Дорога впереди заканчивается: нужно повернуть налево или направо.','Дорога впереди раздваивается. Заранее выберите нужную полосу.','Щит межштатной магистрали (Interstate). По форме щита видно, какого типа эта дорога.','Щит федеральной трассы (U.S. Route) с номером дороги.','Парк или место отдыха. Запомнить: коричневый цвет — природа и отдых.','Зона отдыха (rest area), где можно остановиться и отдохнуть. Это синий знак услуг, как заправки, еда и больницы. Коричневые знаки — парки и зоны рекреации.','Зелёный указатель: названия городов и расстояние до них.','Впереди дорожные работы. Сбавьте скорость: рабочие могут быть рядом с дорогой.','Объезд: стрелка показывает, куда поворачивать, пока основная дорога закрыта.','Впереди флагман, который регулирует движение. Выполняйте его сигналы.','Впереди железнодорожный переезд. Сбавьте скорость, смотрите и слушайте, будьте готовы остановиться.','Этот знак стоит прямо у путей. Если приближается поезд, остановитесь и уступите ему.'];
const GT=[{n:'Формы и цвета',a:-1,x:[5,6,8,9,10,11,12,13,14],t:'Знак можно узнать, даже не читая надпись: сначала смотрите на форму, потом на цвет. Восьмиугольник — всегда STOP, перевёрнутый треугольник — Yield (уступи), ромб — предупреждение об опасности, круг — железнодорожный переезд, пятиугольник — школа. Цвета: красный — стоп и запреты, жёлтый — предупреждение, оранжевый — дорожные работы, зелёный — указатели, синий — услуги, коричневый — парки и отдых. В учебнике знаки чёрно-белые, здесь цвета добавлены по стандарту США.'},
{n:'Регулирующие знаки (Regulatory)',a:0,b:9,x:[],t:'Это знаки-правила: их нужно выполнять. Они требуют остановиться, уступить, не въезжать, не поворачивать, не обгонять или не превышать скорость. Красный цвет — самые строгие требования (STOP, Yield, въезд запрещён), остальные чаще чёрно-белые.'},
{n:'Предупреждающие знаки (Warning)',a:10,b:23,x:[],t:'Они предупреждают об опасности впереди: поворот, перекрёсток, скользкая дорога, пешеходы. Обычно это жёлтый ромб (школьный знак — пятиугольник). Увидели такой знак — сбавьте скорость и будьте внимательнее.'},
{n:'Указатели и услуги (Guide)',a:24,b:28,x:[6,13,14],t:'Эти знаки помогают ориентироваться: куда ехать, сколько до города, где зона отдыха или заправка. Зелёные знаки — указатели, синие — услуги (заправки, больницы, rest area), коричневые — парки и зоны рекреации. Номер дороги показывает щит: у Interstate и U.S. Route форма разная.'},
{n:'Дорожные работы и переезды',a:29,b:33,x:[10,12],t:'Оранжевый цвет — работы на дороге: сбавьте скорость, будьте готовы к объезду и к рабочим. Перед железнодорожным переездом стоит круглый жёлтый знак, а белый крест Railroad Crossing стоит прямо у путей: поезду нужно уступить.'}];

const L=(g.r?[]:g.a<0?SH.map(c):SG.slice(g.a,g.b+1).map((s,j)=>c([s[0],s[1],EX[g.a+j]]))).concat(SG2.filter(s=>GT[s[3]]===g).map(s=>c([s[0],s[1],s[2]]))).concat(g===GT[XG]?SG3.map(s=>c(s)):[]);
app.innerHTML=`<p class="mute"><a href="#" onclick="grp();return false">← Все темы</a></p><h2>${g.n}</h2><p class="mute">${pg(g)}</p><div class="exp">${g.t}</div><br>`+L.join('')+HC(i,g)+`<button class="go" onclick="gq(${i})">Проверить себя</button>`;window.scrollTo(0,0)}

const c=CQ[0];app.innerHTML=`<p class="mute">Осталось карточек: ${CQ.length}</p>${c.img?`<img class="qi" src="${c.img}" alt="">`:''}<h2>${c.q}</h2>`+(CF?`<div class="exp">${c.b?`<b>${c.a}</b><br>${c.b}`:c.a}</div><p class="mute">Насколько хорошо вы это знали?</p>${bt(c)}`:`<button class="go" onclick="CF=true;card()">Показать ответ</button>`)}
function rate(r){const c=CQ.shift(),o=C[c.id]||{s:0},n=Date.now();c.ord=null;c.pk=null;
if(r==0){o.s=0;o.d=n+3e5;CQ.splice(Math.min(2,CQ.length),0,c)}
else if(r==1){o.s=0;o.d=n+6e4;CQ.splice(Math.min(5,CQ.length),0,c)}
else if(r==2)o.d=n+36e5;

else{o.s=(o.s||0)+1;o.d=n+[2,4,7,14,30][Math.min(o.s-1,4)]*864e5}

const RT=[
{n:'Скорость и торможение',t:'Ограничение скорости рассчитано на хорошие условия. Если дорога мокрая или скользкая, видно плохо или много машин, нужно ехать медленнее: оштрафовать могут и при разрешённой скорости, если она слишком высока для условий. Тормозной путь растёт быстрее скорости: при 60 миль/ч он больше чем в три раза длиннее, чем при 30. На сухой дороге с хорошими шинами при 50 миль/ч нужно около 400 футов (≈120 м), при 30 миль/ч около 200 футов (≈60 м). Слишком медленная езда тоже опасна: если за вами собралась колонна, пропустите её, когда это безопасно.',q:[

['Во сколько раз длиннее тормозной путь при 60 миль/ч, чем при 30 миль/ч?',['Ровно вдвое','Чуть больше чем вдвое','Больше чем в три раза','Такой же'],2,'Тормозной путь растёт быстрее скорости: при 60 миль/ч он больше чем в три раза длиннее, чем при 30 миль/ч.'],
['Какой путь нужен, чтобы заметить препятствие и остановиться при 50 миль/ч (сухая дорога, хорошие шины)?',['Около 100 футов','Около 200 футов','Около 400 футов','Около 800 футов'],2,'При 50 миль/ч около 400 футов (длина городского квартала), при 30 миль/ч около 200 футов.'],
['За вашей медленной машиной собралась колонна. Что делать?',['Ехать так же и не обращать внимания','Прижаться и пропустить, когда это безопасно','Резко затормозить','Включить аварийку и ехать дальше'],1,'Слишком медленная езда тоже опасна. Если собралась колонна, съедьте в безопасное место и пропустите машины.']]},
{n:'Право проезда и перекрёстки',t:'Закон определяет, кто должен уступить, но никому не даёт права проезда: избежать столкновения должен каждый. Пешеходам на переходе (размеченном или нет) уступают всегда. При левом повороте уступаете встречным, которые едут прямо. На кольце уступаете тем, кто уже на нём. Без знаков уступаете тому, кто справа. При выезде со двора или с обочины уступаете машинам на главной дороге. На перекрёстке с четырьмя знаками STOP после полной остановки первым едет тот, кто приехал раньше, а при одновременном приезде тот, кто справа. Если школьный автобус остановился с красными мигающими огнями, нужно полностью остановиться, с любой стороны дороги и на перекрёстке (если дорога не разделена барьером), и не ехать, пока огни не погаснут и дети не уйдут с проезжей части. Экстренным службам с сиреной или проблесковыми огнями тоже нужно уступать: полностью остановиться у правого края дороги и стоять, пока они не проедут (если вы на перекрёстке, сначала проехать его).',q:[
['Вы подъехали к перекрёстку с четырьмя знаками STOP одновременно с другой машиной. Кто едет первым?',['Машина слева от вас','Машина справа от вас','Та, что едет быстрее','Та, что поворачивает налево'],1,'Остановитесь полностью. Кто приехал первым, тот и едет; при одновременном приезде уступите машине справа.'],
['При повороте налево вы должны уступить:',['Попутным машинам','Встречным машинам, которые едут прямо','Никому, у вас приоритет','Только автобусам'],1,'Тот, кто поворачивает налево, уступает встречным машинам, едущим прямо.'],
['Вы въезжаете на кольцо (roundabout). Кому нужно уступить?',['Тем, кто въедет позже вас','Тем, кто уже едет по кольцу, и пешеходам на переходе','Только пешеходам','Никому'],1,'Въезжающие уступают движущимся по кольцу. Останавливаться внутри кольца нельзя.'],
['Впереди остановился школьный автобус с мигающими красными огнями. Он на встречной полосе, дорога без разделителя. Что делать?',['Объехать с осторожностью','Полностью остановиться (а не просто замедлиться) и стоять, пока огни не погаснут и дети не уйдут с дороги','Сбавить скорость и ехать дальше','Посигналить'],1,'Красные мигающие огни означают, что автобус остановился, пока дети выходят или садятся. Останавливаться нужно с любой стороны дороги и на перекрёстке. Исключение: встречные полосы разделены барьером или разделительной полосой. После того как огни погаснут, проверьте, что дети ушли с проезжей части.'],
['Вы услышали сирену скорой помощи позади вас. Что делать?',['Ускориться и уехать','Прижаться к правому краю и остановиться, пока она не проедет','Остановиться посреди дороги','Перестроиться влево'],1,'Полностью остановитесь у правого края дороги (или как можно правее) и стойте, пока машина не проедет, если полицейский или пожарный не скажет иначе. Если вы на перекрёстке, сначала проедьте его и только потом прижимайтесь.']]},
{n:'Парковка',t:'Паркуйтесь только там, где вы не мешаете движению. Нельзя парковаться: ближе 10 футов (≈3 м) к пожарному гидранту; ближе 25 футов (≈7,6 м) к знаку STOP и к пешеходной зоне безопасности; на перекрёстке, пешеходном переходе, тротуаре, мосту, в тоннеле, на рельсах и в велодорожке; перед въездом во двор; на месте для людей с инвалидностью без разрешения; рядом с уже припаркованной машиной (двойная парковка); дальше одного фута от бордюра. На склоне поверните колёса так, чтобы машина покатилась прочь от дороги. Не оставляйте ключи в машине и ставьте её на стояночный тормоз.',q:[

['Не ближе какого расстояния до знака STOP можно парковаться?',['10 футов','15 футов','25 футов','50 футов'],2,'25 футов (около 7,6 м). Столько же до пешеходной зоны безопасности.'],
['Вы паркуетесь на склоне. Как повернуть колёса?',['Прямо','Резко в сторону бордюра или обочины','Резко в сторону дороги','Это не важно'],1,'Колёса поворачивают к бордюру или обочине: если машина покатится, она уйдёт от движения.'],
['Какая из этих парковок запрещена?',['У бордюра, как можно ближе к нему','Рядом с уже припаркованной машиной, на проезжей части (двойная парковка)','В обозначенной зоне парковки','На разрешённом месте на улице'],1,'Двойная парковка запрещена. Также нельзя парковаться дальше одного фута от бордюра.']]},
{n:'Фары, сигналы и клаксон',t:'Запомните правило из учебника: если включены дворники, включите и фары. По закону Коннектикута фары нужны: с получаса после заката до получаса до рассвета; когда из-за плохой освещённости или погоды людей и машины не различить с расстояния 500 футов (около 150 м); и во время осадков (дождь, снег, туман). Дворники обычно значат, что идут осадки, поэтому правило и легко запомнить. Габаритные огни (parking lights) только для стоянки. Дальний свет используйте, когда нет встречных машин; переключайтесь на ближний примерно за квартал до встречной машины, когда едете за другой машиной, в тумане и сильный дождь. Если встречный водитель не переключил дальний, мигните фарами пару раз, а потом смотрите на правый край дороги. Поворотник включайте минимум за 3 секунды до манёвра, но не слишком рано, если до поворота есть другие въезды. Если нужно резко замедлиться там, где этого не ждут, быстро нажмите на тормоз 3–4 раза. Клаксон: лёгкое нажатие, чтобы привлечь внимание, резкий сигнал при настоящей опасности. Не сигнальте слепым пешеходам и лошадям.',q:[
['Вы включили дворники. Что нужно сделать с фарами?',['Ничего','Включить фары (правило из учебника)','Включить только дальний свет','Включить габаритные огни'],1,'Учебник: включил дворники, включи и фары. Дворники обычно значат дождь, снег или туман, а в осадки фары нужны по закону Коннектикута (§ 14-96a), даже днём. Габаритные огни только для стоянки.'],
['Встречная машина едет с дальним светом. Что делать?',['Включить свой дальний в ответ','Мигнуть фарами пару раз, а затем смотреть на правый край дороги','Смотреть на середину дороги','Остановиться посреди полосы'],1,'Мигните фарами. Если водитель не переключил свет, смотрите на правый край дороги, чтобы не ослепнуть.'],
['За сколько времени до манёвра нужно включить поворотник?',['За 1 секунду','Минимум за 3 секунды','За 10 секунд','Только если рядом есть машины'],1,'Не менее чем за 3 секунды и всегда, даже если вокруг никого нет.'],
['Рядом с кем нельзя сигналить клаксоном?',['С пешеходом, который выходит на проезжую часть','Со слепым пешеходом','С машиной, которая может вас задеть','С ребёнком, бегущим к дороге'],1,'Рядом со слепыми пешеходами сигналить нельзя: это может напугать или сбить с толку. Не сигнальте и рядом с лошадьми: они могут испугаться.'],
['Вам нужно резко замедлиться там, где водитель сзади этого не ждёт. Что сделать?',['Ничего','Несколько раз быстро нажать на педаль тормоза','Включить дальний свет','Посигналить'],1,'Быстро нажмите на тормоз 3–4 раза, чтобы стоп-сигналы привлекли внимание сзади идущего.']]},
{n:'Алкоголь, полиция, аварийные ситуации',t:'Водителям младше 21 года действует «нулевая терпимость»: нельзя ехать с любым измеримым количеством алкоголя, порог 0,02 %. Отказ от теста на алкоголь в любом возрасте означает приостановку прав минимум на 45 дней. Если вас остановила полиция (мигают синие или сине-красные огни), оставайтесь в машине с закрытыми дверями и доставайте документы только по просьбе офицера. При поломке съезжайте с дороги, поставьте предупреждающие знаки или фальшфейеры (flares) и никогда не стойте на проезжей части. Отказали тормоза: несколько раз быстро нажмите на педаль тормоза, затем плавно потяните стояночный тормоз. Лопнула шина: держите руль крепко и ровно, плавно сбавьте скорость и не тормозите резко.',q:[
['Какой уровень алкоголя в крови считается нарушением для водителя младше 21 года?',['0,08 % и выше','0,05 % и выше','0,02 % и выше','Только 0,10 %'],2,'Для водителей до 21 года действует нулевая терпимость, порог 0,02 %.'],
['Что будет, если отказаться от теста на алкоголь?',['Ничего','Права приостановят минимум на 45 дней','Только предупреждение','Штраф без других последствий'],1,'При отказе права приостанавливают минимум на 45 дней, независимо от возраста.'],
['Вас остановила полиция. Как себя вести?',['Выйти из машины и подойти к полицейскому','Остаться в машине с закрытыми дверями и доставать документы только по просьбе','Достать документы заранее и держать их в руках','Отъехать на следующий перекрёсток'],1,'Оставайтесь в машине, двери закрыты, документы достаёте только по просьбе офицера.'],
['У вас отказали тормоза. Что сделать в первую очередь?',['Выключить зажигание','Несколько раз нажать на педаль тормоза','Резко дёрнуть стояночный тормоз','Включить заднюю передачу'],1,'Несколько раз быстро нажмите на педаль тормоза. Если не помогло, плавно потяните стояночный тормоз (не резко), чтобы не заблокировать задние колёса и не получить занос.'],
['У вас лопнула шина. Что нужно делать?',['Резко затормозить','Держать руль крепко и ровно, плавно сбавить скорость','Резко повернуть руль к обочине','Заглушить двигатель'],1,'Держите руль, не тормозите резко, плавно сбавьте скорость и съезжайте с дороги в безопасном месте.']]}];
RT.push(
{n:'Светофоры и сигналы',t:'Зелёный: можно ехать, если это безопасно. Если вы стояли, сначала дайте проехать тем, кто ещё в перекрёстке. При левом повороте уступайте встречным, при правом — пешеходам. Жёлтый: сейчас станет красным. Остановитесь, если это безопасно, а если вы уже на перекрёстке, проезжайте. Красный: стойте, пока не загорится зелёный и не освободится перекрёсток. Правый поворот на красный разрешён после полной остановки, если нет встречного движения и знака, запрещающего поворот; уступите пешеходам. Мигающий красный работает как знак STOP, мигающий жёлтый значит «сбавьте скорость и будьте осторожны». Стрелки: красная запрещает движение в её сторону, жёлтая предупреждает, что защита зелёной стрелки заканчивается, зелёная разрешает безопасный поворот в её сторону.',q:[
['Вы уже на перекрёстке, когда загорелся жёлтый. Что делать?',['Остановиться на месте','Сдать назад','Проехать перекрёсток','Прижаться к краю и ждать'],2,'Если вы уже на перекрёстке, не останавливайтесь, проезжайте. Остановиться нужно только до перекрёстка и только если это безопасно.'],
['Вы стоите на красном и хотите повернуть направо. Когда это можно?',['Никогда','После полной остановки, если нет встречного движения и знака, запрещающего поворот','Сразу, без остановки','Только ночью'],1,'Остановитесь полностью, убедитесь, что поворот не запрещён знаком, и уступите пешеходам.'],
['Над перекрёстком мигает красный сигнал светофора. Что он означает?',['Сбавить скорость','То же, что знак STOP: остановиться полностью и ехать, когда безопасно','Дорога закрыта','Можно ехать без остановки'],1,'Мигающий красный работает как знак STOP: остановитесь полностью и поезжайте, когда это безопасно.'],
['Над перекрёстком мигает жёлтый сигнал светофора. Что он означает?',['Остановиться','Сбавить скорость и ехать осторожно','Уступить и ждать','Дорога закрыта'],1,'Сбавьте скорость и будьте внимательны (slow down and proceed with caution).'],
['Что означает красная стрелка?',['Можно ехать в сторону стрелки после остановки','Ехать в сторону стрелки нельзя, пока она не погаснет и не загорится зелёный','Нужно уступить и ехать','Нужно сбавить скорость'],1,'Красная стрелка запрещает движение в её сторону.']]},
{n:'Дорожная разметка',t:'Белые линии разделяют полосы с одним направлением, жёлтые разделяют встречные потоки. Пунктирная белая: полосу можно менять, если это безопасно. Сплошная белая: оставайтесь в своей полосе, если нет особой ситуации. Двойная сплошная белая запрещает перестроение. Сплошная белая линия идёт по правому краю дороги, сплошная жёлтая по левому краю разделённой дороги. Пунктирная жёлтая между встречными полосами: обгон разрешён. Если рядом пунктирная и сплошная жёлтые линии, обгонять можно со стороны пунктирной. Двойная сплошная жёлтая отмечает центр дороги; через неё нельзя обгонять, но можно пересекать её, чтобы повернуть налево во двор или на другую дорогу. Если нужно остановиться, остановитесь до стоп-линии. Пешеходам на переходе, размеченном или нет, уступайте всегда. HOV — полоса для машин, в которых несколько человек; Transit — для автобусов.',q:[
['Что означает пунктирная белая линия между полосами одного направления?',['Менять полосу нельзя','Менять полосу можно, если это безопасно','Здесь нужно остановиться','Это край дороги'],1,'Пунктирная белая линия разрешает перестроиться, если это безопасно.'],
['Что означает двойная сплошная белая линия?',['Перестраиваться можно','Перестраиваться запрещено','Здесь парковка','Дорога односторонняя'],1,'Двойная сплошная белая линия запрещает смену полосы.'],
['Рядом идут пунктирная и сплошная жёлтые линии. Где можно обгонять?',['С любой стороны','Только со стороны пунктирной линии','Только со стороны сплошной линии','Нигде'],1,'Обгон разрешён со стороны пунктирной линии, но не со стороны сплошной.'],
['Вам нужно остановиться на светофоре. Где остановиться?',['На самом перекрёстке','Перед стоп-линией','За пешеходным переходом','Там, где удобно'],1,'Если нужно остановиться из-за знака или сигнала, остановитесь до стоп-линии.'],
['На переходе, размеченном или нет, стоит пешеход. Что вы должны сделать?',['Проехать быстрее','Уступить пешеходу','Посигналить','Объехать сзади'],1,'Водители обязаны уступать пешеходам на размеченном и неразмеченном переходе.'],
['Для кого предназначена полоса с пометкой HOV?',['Только для автобусов','Для машин, в которых несколько человек','Для велосипедов','Для экстренных служб'],1,'HOV (High Occupancy Vehicles) — для машин с несколькими людьми. На знаках указано, сколько человек должно быть в машине.']]});
RT.push(
{n:'Дистанция и пространство вокруг машины',t:'Правило трёх секунд показывает, не слишком ли близко вы едете. Когда задняя часть машины впереди проезжает столб или знак, начните считать: «раз-одна-тысяча, два-одна-тысяча, три-одна-тысяча». Если вы проехали этот ориентир раньше, чем досчитали, дистанция слишком мала: сбросьте скорость и проверьте снова. Правило работает на любой скорости. Четыре секунды нужны на скользкой дороге, в темноте и непогоду, за мотоциклом, грузовиком или автобусом (их водители вас могут не видеть), с прицепом и на подъёме. Если вам «сели на хвост» (tailgating), перестройтесь вправо; если полосы нет, дождитесь свободной дороги и плавно сбавьте скорость. Резко тормозить нельзя. Не ездите в слепой зоне чужих машин (сбоку и чуть сзади) и не оставайтесь рядом с грузовиком или автобусом. Обгоняя велосипедиста, оставляйте не менее трёх футов (около 1 м).',q:[
['Как проверить, что вы держите достаточную дистанцию (following distance)?',['Досчитать до трёх: до ориентира вы должны доехать не раньше, чем закончите счёт','Проехать ориентир одновременно с машиной впереди','Держать расстояние в одну длину машины','Держать поворотник включённым три секунды'],0,'Выберите ориентир (столб, знак). Когда задняя часть машины впереди его проехала, считайте «раз-одна-тысяча, два-одна-тысяча, три-одна-тысяча». Если вы доехали до ориентира раньше, чем досчитали, вы едете слишком близко: сбавьте скорость и проверьте снова. Учебник, стр. 21.'],
['В какой ситуации нужна дистанция не три, а четыре секунды?',['Сухая дорога днём','Скользкая дорога или плохая видимость','Пустая трасса','Когда вы едете без пассажиров'],1,'Четыре секунды нужны на скользкой дороге, в темноте и непогоду, за мотоциклом, грузовиком или автобусом, с прицепом, на подъёме.'],
['Вы едете за грузовиком. Почему нужна большая дистанция?',['Его водитель может вас не видеть и внезапно остановиться, а сам грузовик закрывает обзор','Грузовики всегда едут медленнее','Так положено только ночью','Это нужно только на мосту'],0,'Водители грузовиков, автобусов и фургонов могут не видеть вас прямо за собой, а большие машины ещё и закрывают обзор.'],
['За вами едут слишком близко (tailgating). Что делать?',['Резко затормозить, чтобы проучить водителя','Перестроиться вправо; если полосы нет, дождаться свободной дороги и плавно сбавить скорость','Ускориться до предела','Включить дальний свет'],1,'Резко сбавлять скорость нельзя: так вы повышаете риск удара сзади.'],
['Какой минимальный зазор нужно оставить при обгоне велосипедиста?',['1 фут','2 фута','3 фута','10 футов'],2,'Не менее 3 футов (около 1 метра) между машиной и велосипедом.'],
['Где находится слепая зона чужой машины?',['Строго впереди','С боков и чуть сзади','Прямо за её бампером','Слепых зон нет, зеркала всё показывают'],1,'Не ездите сбоку и чуть сзади от чужой машины: водитель может вас не увидеть. Проезжайте эту зону быстро.']]},
{n:'Смена полос, обгон, повороты',t:'Перед сменой полосы посмотрите в зеркала, а затем через плечо в сторону манёвра: зеркала не показывают слепую зону. Взгляд на дорогу впереди нельзя отводить надолго. Проверьте и дальнюю полосу: там тоже кто-то может хотеть перестроиться. Меняйте по одной полосе за раз. Обгон: нужно достаточно места, чтобы вернуться в полосу, и обгонять лучше по одной машине. При 55 миль/ч на обгон нужно около 10 секунд и более 1600 футов (≈500 м) свободной дороги. Возвращаться можно, когда в зеркале видны обе фары обогнанной машины. Нельзя обгонять там, где знак или разметка запрещают, на перекрёстках, у железнодорожных переездов, у въездов на парковки и по обочине. Левая полоса на многополосной дороге предназначена для обгона. Если в вашем направлении меньше трёх полос, в Коннектикуте нужно ехать по правой, кроме обгона. Поворот: поворачивайте из полосы, ближайшей к повороту, в ближайшую полосу. Не отклоняйтесь влево перед правым поворотом. Задним ходом по полосе движения ездить нельзя: только для параллельной парковки или разворота «в три приёма». Если проехали нужный поворот, не сдавайте назад, а поезжайте дальше.',q:[
['Что нужно сделать перед сменой полосы, кроме взгляда в зеркала?',['Ничего, зеркал достаточно','Посмотреть через плечо в сторону манёвра','Посигналить','Мигнуть фарами'],1,'Зеркала не показывают слепую зону, поэтому повернитесь и посмотрите через плечо.'],
['Вам нужно перестроиться через три полосы. Как правильно?',['Сразу пересечь все три','Менять полосу по одной за раз','Дождаться, пока все полосы освободятся','Использовать обочину'],1,'Менять полосы нужно по одной, как подниматься по ступенькам.'],
['Сколько свободной дороги примерно нужно для безопасного обгона при 55 миль/ч?',['Около 100 футов','Около 500 футов','Более 1600 футов','Около 5000 футов'],2,'При 55 миль/ч на обгон уходит около 10 секунд, и встречная машина тоже проезжает больше 800 футов.'],
['Когда можно вернуться в свою полосу после обгона?',['Сразу после того, как поравнялись с машиной','Когда в зеркале видны обе фары обогнанной машины','Когда мигнёт встречный','Когда включите поворотник'],1,'Вернитесь, когда в зеркале заднего вида видны обе фары обогнанной машины.'],
['Где обгон запрещён?',['На прямой дороге с хорошей видимостью','На перекрёстках, железнодорожных переездах и по обочине','В левой полосе многополосной дороги','Там, где пунктирная жёлтая линия'],1,'Нельзя обгонять там, где машина может внезапно выехать или пересечь дорогу, а также по обочине.'],
['В вашем направлении две полосы, и вы никого не обгоняете. Какую полосу занять в Коннектикуте?',['Любую','Левую','Правую','Ту, где меньше машин'],2,'Если в вашем направлении меньше трёх полос, по закону Коннектикута нужно ехать по правой, кроме обгона.'],
['Вы пропустили нужный поворот. Что делать?',['Сдать назад по полосе','Ехать дальше, пока не найдёте безопасное место для разворота','Остановиться и подождать','Развернуться через сплошную линию'],1,'Задним ходом по полосе движения ездить нельзя: только для параллельной парковки или разворота «в три приёма».']]});
RT.push(
{n:'Законы Коннектикута: ремни, телефон, Move Over',t:'Ремни. В Коннектикуте нельзя ехать без ремня ни водителю, ни пассажиру. Штраф 75 долларов, его могут выписать обоим. Пристёгиваться нужно полностью (поясной и плечевой ремни), даже если есть подушки безопасности. Дети младше 16 лет должны ехать в подходящей детской системе безопасности. Младше 2 лет или легче 30 фунтов: кресло, обращённое назад, с 5-точечными ремнями. От 2 до 5 лет или легче 40 фунтов: кресло с 5-точечными ремнями. От 5 до 8 лет или 40–60 фунтов: 5-точечные ремни или бустер. От 8 лет и от 60 фунтов: бустер или ремень. Если возраст и вес попадают в разные категории, действует более строгое требование. Кресло, обращённое назад, нельзя ставить на переднее сиденье, если там работает подушка безопасности. Водитель отвечает за то, чтобы пассажиры 7–16 лет были пристёгнуты. Телефон. Нельзя пользоваться телефоном или другим устройством в руке за рулём, в том числе когда машина остановилась из-за пробки или светофора. Допустима только гарнитура, а водителям 16–17 лет нельзя вообще ничего, даже громкую связь. Исключение: экстренный звонок. Move Over. Если на дороге или обочине стоит остановившаяся машина, сбавьте скорость ниже разрешённой и, если это безопасно, перестройтесь на одну полосу. В зоне дорожных работ штраф за нарушение может достигать 1000 долларов, а штрафы за телефон удваиваются.',q:[
['Какой штраф за непристёгнутый ремень в Коннектикуте?',['25 долларов','50 долларов','75 долларов','150 долларов'],2,'Штраф 75 долларов. Его могут выписать и водителю, и пассажиру.'],
['Кто должен быть пристёгнут в машине в Коннектикуте?',['Только водитель','Водитель и передний пассажир','Водитель и все пассажиры','Только дети'],2,'Ехать без ремня нельзя ни водителю, ни пассажиру. Ремни нужны даже при наличии подушек безопасности.'],
['Ребёнку 3 года, он весит 35 фунтов. Какая система безопасности ему нужна?',['Только ремень безопасности','Детское кресло с 5-точечными ремнями','Бустер','Ничего, если он сидит сзади'],1,'От 2 до 5 лет или легче 40 фунтов нужно кресло с 5-точечными ремнями.'],
['Можно ли поставить детское кресло, обращённое назад (rear-facing: ребёнок сидит спиной к лобовому стеклу), на переднее сиденье?',['Да, всегда','Нет, если на переднем сиденье работает подушка безопасности (airbag)','Да, если ребёнку больше 3 лет','Только днём'],1,'Закон Коннектикута запрещает ставить такое кресло на переднее сиденье, если там есть работающая подушка безопасности: при срабатывании она бьёт прямо в кресло. Если подушки нет или она не работает, закон этого не запрещает. Детей младше 2 лет или легче 30 фунтов (≈14 кг) возят только в кресле, обращённом назад. Учебник, стр. 12.'],
['Вы стоите на светофоре с телефоном в руке. Это разрешено?',['Да, машина стоит','Нет: даже на светофоре или в пробке пользоваться телефоном в руке нельзя','Да, если мотор выключен','Да, но только днём'],1,'Нельзя, даже когда машина временно остановилась из-за пробки, условий дороги или светофора. Допустима гарнитура, а также звонок, если вы безопасно припарковались на обочине.'],
['Водителю 17 лет. Что ему разрешено в отношении телефона?',['Только громкая связь','Только гарнитура','Ничего: водителям 16–17 лет нельзя пользоваться телефоном вообще, даже с гарнитурой','Разговаривать на светофоре'],2,'Для водителей 16 и 17 лет запрещены любые телефоны и устройства, в том числе с громкой связью.'],
['На обочине стоит остановившаяся машина. Что требует закон Move Over?',['Посигналить','Сбавить скорость ниже разрешённой и, если безопасно, перестроиться на одну полосу','Остановиться за ней','Ничего'],1,'Сбавьте скорость ниже разрешённой и, если это безопасно, перестройтесь на одну полосу.']]},
{n:'Молодые водители (до 18 лет)',t:'Для водителей 16–17 лет в Коннектикуте действуют особые ограничения. Ученические права (learner’s permit): на всё время их действия нельзя возить пассажиров, кроме лицензированного инструктора (и сопровождающих его) или одного человека, который даёт инструкцию, ему не менее 20 лет и у него четыре года подряд есть права без приостановок. Родители или опекуны могут ехать вместе с инструктором. Первые шесть месяцев после получения прав: нельзя возить пассажиров, кроме инструктора, родителей или опекуна (хотя бы один из них с действующими правами) или одного человека не младше 20 лет со стажем четыре года подряд. С седьмого по двенадцатый месяц дополнительно можно возить членов ближайшей семьи. Комендантский час: с 23:00 до 5:00 водить нельзя, если это не поездка на работу, учёбу, религиозное мероприятие, по медицинской необходимости или в программе Safe Ride. Ещё: нельзя возить больше пассажиров, чем ремней; нельзя пользоваться телефоном, даже с гарнитурой; нельзя возить пассажира на мотоцикле шесть месяцев после получения мотоциклетного допуска. За нарушение правил ученических прав permit могут приостановить. Осуждение за нарушение закона о телефоне до 18 лет ведёт к приостановке прав.',q:[
['Кого может возить новичок 16–17 лет в первые шесть месяцев после получения прав?',['Друзей своего возраста','Только инструктора, родителей или опекуна, либо одного человека не младше 20 лет со стажем 4 года','Всех, если хватает ремней','Любых пассажиров днём'],1,'Первые шесть месяцев пассажиров почти нельзя: только инструктор, родители или опекун, либо один человек от 20 лет со стажем четыре года подряд.'],
['Во сколько действует комендантский час для водителей 16–17 лет (кроме исключений)?',['С 21:00 до 5:00','С 22:00 до 6:00','С 23:00 до 5:00','С 0:00 до 4:00'],2,'С 23:00 до 5:00. Исключения: работа, учёба, религиозные мероприятия, медицинская необходимость, программа Safe Ride.'],
['Кого дополнительно можно возить с седьмого по двенадцатый месяц после получения прав?',['Любых друзей','Членов ближайшей семьи','Только одного друга','Никого'],1,'С седьмого по двенадцатый месяц разрешены дополнительные пассажиры из ближайшей семьи.'],
['Сколько пассажиров может везти водитель 16–17 лет?',['Сколько угодно','Не больше, чем ремней безопасности','Не больше двух','Не больше одного'],1,'Нельзя возить больше пассажиров, чем в машине ремней. Остальные ограничения тоже действуют.'],
['Что ждёт водителя младше 18 лет, осуждённого за нарушение закона о телефоне?',['Предупреждение','Приостановка прав','Только штраф','Ничего'],1,'Для водителей до 18 лет осуждение за нарушение закона о телефоне ведёт к приостановке прав.'],
['Кто может ехать с владельцем ученических прав (permit) 16–17 лет, пока у него действует permit?',['Любой друг','Только инструктор или один человек от 20 лет со стажем 4 года (родители могут ехать вместе с инструктором)','Любой взрослый','Сверстники'],1,'Пассажиры ограничены: инструктор и сопровождающие его или один обучающий человек от 20 лет со стажем четыре года.']]});
RT.push(
{n:'Плохая погода и скользкая дорога',t:'Сбавляйте скорость при первых признаках дождя, снега или мокрого снега. На мокрой дороге уменьшите скорость примерно на 10 миль/ч, на укатанном снегу вдвое, на льду нужно ехать «ползком». Лёд раньше всего появляется в тени, на мостах и эстакадах (под ними нет земли, которая удерживает тепло). Около нуля градусов лёд становится мокрым и ещё более скользким. Первые минуты дождя в жару тоже скользкие: масло выходит из асфальта. На мокрой дороге шины хорошо держат до 35 миль/ч. На большей скорости шины начинают «всплывать» на воде, как водные лыжи, и теряют сцепление с дорогой: это аквапланирование (hydroplaning). В сильный дождь сцепление может пропасть совсем, а у изношенных шин оно пропадает на меньшей скорости. Лучшая защита — сбавить скорость. Если шины потеряли сцепление: уберите ногу с газа, держите руль прямо и не тормозите и не поворачивайте, пока шины снова не схватятся. Перед поворотом сбросьте скорость заранее, тормозить в самом повороте нельзя. На гравии и грунте тормозной путь длиннее и легко занести. Если светофор на перекрёстке не работает, остановитесь, как у знака STOP. Шипованные шины в Коннектикуте разрешены с 15 ноября по 30 апреля.',q:[
['На сколько нужно примерно снизить скорость на мокрой дороге?',['Примерно на 2 миль/ч','Примерно на 10 миль/ч','Примерно на 30 миль/ч','Снижать не нужно'],1,'Примерно на 10 миль/ч. На укатанном снегу скорость нужно уменьшить вдвое.'],
['Как нужно изменить скорость на укатанном снегу?',['Не менять','Снизить на 5 миль/ч','Уменьшить вдвое','Увеличить для устойчивости'],2,'На укатанном снегу скорость нужно сократить вдвое, на льду ехать «ползком».'],
['Где лёд появляется раньше всего?',['На мостах, эстакадах и в тени','На широких прямых участках','В центре города','Только ночью'],0,'Мосты и эстакады промерзают быстрее, потому что под ними нет земли, а тень замерзает первой и высыхает последней.'],
['Ваши шины потеряли сцепление на мокрой дороге (hydroplaning). Что делать?',['Резко затормозить','Убрать ногу с газа, держать руль прямо, не тормозить и не поворачивать, пока шины не схватятся','Резко повернуть руль','Ускориться'],1,'Резкое торможение или поворот может привести к заносу.'],
['До какой скорости большинство шин хорошо держат сцепление на мокрой дороге?',['До 15 миль/ч','До 35 миль/ч','До 55 миль/ч','До 70 миль/ч'],1,'Примерно до 35 миль/ч. На большей скорости шины начинают «скользить» по воде, это аквапланирование.'],
['Светофор на перекрёстке не работает. Как проехать?',['Как будто горит зелёный','Остановиться, как у знака STOP','Проехать быстро','Ждать, пока включится'],1,'Закон требует остановиться, как будто на перекрёстке знак STOP.'],
['Когда в Коннектикуте разрешены шипованные шины?',['С 1 октября по 30 апреля','С 15 ноября по 30 апреля','Круглый год','С 1 декабря по 1 марта'],1,'С 15 ноября по 30 апреля.'],
['Как правильно входить в поворот?',['Тормозить в самом повороте','Сбавить скорость до поворота и не тормозить в нём','Разогнаться','Включить дальний свет'],1,'Торможение в повороте может привести к заносу, поэтому сбавляйте скорость заранее.']]},
{n:'Грузовики и No-Zone',t:'Грузовики, автобусы и дома на колёсах длиннее, выше и шире обычных машин, медленно разгоняются и дольше тормозят. Вокруг них есть опасные зоны (No-Zones), где водитель вас не видит. Если вы не видите лица водителя в его боковом зеркале, он не видит вас. Сзади слепая зона огромная (около 200 футов), спереди до 20 футов от кабины. Держите за грузовиком не менее трёх секунд. Обгоняя, не задерживайтесь рядом с кабиной: сделайте обгон быстро и вернитесь в полосу, когда в зеркале видна вся передняя часть грузовика, а затем не сбавляйте скорость, потому что грузовику нужно почти вдвое больше места для остановки. Если грузовик обгоняет вас, чуть сбавьте скорость и никогда не ускоряйтесь. Не обгоняйте грузовик справа перед перекрёстком: он может сделать широкий правый поворот и прижать вас к бордюру. Если грузовик сдаёт задним ходом, остановитесь и дайте ему место. Ночью за грузовиком используйте ближний свет: дальний слепит водителя в боковых зеркалах. При встрече со встречным грузовиком держитесь как можно правее.',q:[
['Вы не видите лица водителя грузовика в его боковом зеркале. Что это значит?',['Он вас видит','Он вас не видит','Он видит вас только ночью','Это ничего не значит'],1,'Если не видно водителя в его боковом зеркале, то он тоже не видит вас: вы в No-Zone.'],
['Когда можно вернуться в полосу после обгона грузовика?',['Сразу после того, как поравнялись','Когда в зеркале видна вся передняя часть грузовика','Когда грузовик мигнёт','Когда включите дальний свет'],1,'Возвращайтесь, когда в зеркале видна вся передняя часть грузовика, и не сбавляйте скорость.'],
['Какую минимальную дистанцию нужно держать за грузовиком?',['1 секунду','2 секунды','3 секунды','Неважно'],2,'Не менее трёх секунд. Иначе вы «едете вслепую»: не видите дорогу, а водитель не видит вас.'],
['Вас обгоняет грузовик. Что делать?',['Ускориться','Слегка сбавить скорость и не ускоряться','Перестроиться перед ним','Мигнуть фарами'],1,'Чуть сбавьте скорость, чтобы он обогнал вас быстрее. Ускоряться опасно и незаконно.'],
['Грузовик приближается к перекрёстку и готовится повернуть направо. Можно ли обогнать его справа?',['Да, так быстрее','Нет: он может сделать широкий поворот, и вас прижмёт к бордюру','Да, если посигналить','Только ночью'],1,'Грузовики делают широкие повороты. Не пытайтесь протиснуться между ним и бордюром.'],
['Грузовик сдаёт задним ходом. Что делать?',['Объехать его','Остановиться и дать ему сделать это безопасно','Посигналить','Проехать быстрее'],1,'Никогда не объезжайте сдающий задним ходом грузовик: вы можете оказаться вне поля его зрения.'],
['Ночью вы едете за грузовиком. Какой свет использовать?',['Дальний','Ближний','Габаритные огни','Фары не нужны'],1,'Дальний свет слепит водителя грузовика в больших боковых зеркалах.']]},
{n:'Велосипедисты и мотоциклисты',t:'Велосипедист на дороге считается транспортным средством с теми же правами и обязанностями. Уступайте велосипедисту на перекрёстках и там, где велодорожка пересекает дорогу. Штраф за непропуск велосипедиста удваивается. Обгоняя, оставьте не менее 3 футов (около 1 м). После обгона не поворачивайте направо сразу и не тормозите резко. Не сигнальте рядом с велосипедистом без необходимости. Нельзя ехать и парковаться на велодорожке, но можно пересечь её для поворота, уступив велосипедистам. Перед открытием двери посмотрите, нет ли рядом велосипедистов. Если полоса узкая, велосипедист может ехать по её центру. Шлем обязателен для тех, кому меньше 16 лет. Мотоциклист вправе занимать всю полосу: не обгоняйте его в той же полосе. Проверяйте слепые зоны: мотоцикл легко в них прячется. Около 40 % аварий с мотоциклами происходит, когда другая машина поворачивает налево перед мотоциклистом. Поворотник мотоцикла может остаться включённым, поэтому не выезжайте перед ним, пока не убедитесь, что он поворачивает. Держите дистанцию 3–4 секунды, на мокрой дороге больше. Приближаясь к мотоциклисту, переключите фары на ближний свет. Если мотоцикл обгоняет вас, не меняйте полосу и скорость.',q:[
['Что происходит со штрафом, если водитель не уступил велосипедисту?',['Такой же, как для остальных','Удваивается','Отменяется','Только предупреждение'],1,'Штрафы удваиваются за непропуск велосипедиста.'],
['Вы только что обогнали велосипедиста и хотите повернуть направо. Как поступить?',['Повернуть сразу','Не поворачивать сразу после обгона: дать велосипедисту проехать перекрёсток','Посигналить','Ускориться'],1,'Не поворачивайте направо сразу после обгона велосипедиста. Дайте ему проехать перекрёсток.'],
['Можно ли ехать по велодорожке, подготовившись к повороту?',['Да, можно','Нет: ехать по велодорожке нельзя, можно только пересечь её для поворота, уступая велосипедистам','Да, ночью','Да, если там нет велосипедистов'],1,'Нельзя ехать и парковаться на велодорожке. Для поворота её можно пересечь, уступив велосипедистам.'],
['Для кого шлем обязателен при езде на велосипеде?',['Для тех, кому меньше 12 лет','Для тех, кому меньше 16 лет','Для всех до 18 лет','Только для спортсменов'],1,'Для тех, кому меньше 16 лет. Старшим шлем рекомендован.'],
['Мотоциклист включил поворотник. Что нужно помнить?',['Он точно поворачивает','Не выезжайте перед ним, пока не убедитесь, что он действительно поворачивает','Он вас пропускает','Это означает остановку'],1,'Поворотник мотоцикла может остаться включённым после поворота.'],
['Какую дистанцию держать за мотоциклистом?',['1 секунду','3–4 секунды, на мокрой дороге больше','Неважно','10 секунд'],1,'Мотоциклы могут быстро остановиться, поэтому держите 3–4 секунды, на мокрой дороге больше.'],
['Приближаясь к мотоциклисту в темноте, нужно:',['Включить дальний свет','Переключить фары на ближний','Выключить фары','Посигналить'],1,'Дальний свет опаснее для мотоциклиста, чем для водителя автомобиля.'],
['Можно ли обогнать мотоциклиста в той же полосе?',['Да, на высокой скорости','Нет: мотоциклист вправе занимать всю полосу','Да, ночью','Да, справа'],1,'Мотоциклист вправе использовать полосу целиком, и ему нужно место для реакции.']]});
RT.push(
{n:'Как получить права в Коннектикуте',t:'Права на легковую машину называются Class D. Для грузовика или автобуса нужны права CDL, для мотоцикла отдельная отметка (endorsement). Перед тренировками нужны ученические права (learner’s permit), и их нужно носить с собой. Чтобы получить permit, нужно быть не младше 16 лет, пройти проверку зрения и письменный экзамен из 25 вопросов (для сдачи нужно 20 верных). Permit действует до получения прав или 2 года, смотря что наступит раньше. Минимальное зрение для любых прав 20/40 с очками или линзами. Каждый, кто впервые получает права в Коннектикуте и не имеет действующих прав другого штата, любого возраста, должен пройти 8-часовой курс Safe Driving Practices в лицензированной автошколе. Тем, кому 16–17 лет, нужно пройти обучение в автошколе или дома (с инструктором не младше 20 лет и со стажем 4 года), а родителю или опекуну пройти 2 часа обучения законам для водителей до 18 лет. Автошкола: 30 часов теории и не менее 40 часов вождения, ждать экзамена по вождению 120 дней после выдачи permit; остальным 180 дней. Если вам 18 или больше, permit нужно иметь не менее 90 дней до экзамена. Рядом с вами во время тренировок должен сидеть инструктор или наставник на переднем пассажирском сиденье, он должен быть готов взять управление. На экзамен по вождению приезжайте на исправной машине с действующей регистрацией и страховкой. Без прав нельзя приехать за рулём самому и нельзя сдавать на арендованной машине. После сдачи платите 84 доллара, временную бумажную карту выдадут сразу, а постоянная придёт по почте в течение 20 дней.',q:[
['Сколько вопросов на письменном экзамене и сколько нужно ответить верно?',['20 вопросов, 15 верных','25 вопросов, 20 верных','30 вопросов, 25 верных','50 вопросов, 40 верных'],1,'25 вопросов, для сдачи нужно 20 верных.'],
['Каков минимальный возраст для получения ученических прав (permit)?',['15 лет','16 лет','17 лет','18 лет'],1,'Минимум 16 лет.'],
['Сколько действует learner’s permit?',['6 месяцев','1 год','До получения прав или 2 года, смотря что наступит раньше','Бессрочно'],2,'Permit действует до получения прав или 2 года с момента выдачи.'],
['Какое минимальное зрение (с очками или контактными линзами) нужно для прав?',['20/20','20/40','20/70','20/100'],1,'Минимум 20/40.'],
['Вам 16 лет, вы учились в автошколе. Сколько нужно ждать экзамена по вождению после выдачи permit?',['30 дней','60 дней','120 дней','180 дней'],2,'Если обучение прошли в автошколе, ждать нужно 120 дней. Остальным 180 дней.'],
['Вам больше 18 лет. Сколько минимум нужно иметь permit до экзамена по вождению?',['30 дней','60 дней','90 дней','180 дней'],2,'Взрослым нужно держать permit не менее 90 дней.'],
['Какой курс обязателен для всех, кто впервые получает права, независимо от возраста?',['4-часовой','8-часовой Safe Driving Practices','30-часовой','Курс нужен только подросткам'],1,'Всем, кто раньше не имел прав в Коннектикуте и не имеет действующих прав другого штата, нужен 8-часовой курс Safe Driving Practices.'],
['Что должен пройти родитель или опекун 16–17-летнего кандидата?',['Ничего','2 часа обучения законам для водителей до 18 лет и опасностям вождения','8-часовой курс','40 часов за рулём'],1,'Родитель или опекун проходит 2 часа обучения вместе с подростком.'],

RT.push(
{n:'Дорожные работы и страховка',t:'Временные знаки в рабочей зоне всегда оранжевые, с чёрными буквами или символами. Если знаков о снижении скорости нет, соблюдайте обычное ограничение. В Коннектикуте за превышение скорости, игнорирование знаков и сигналов, неправильную полосу или опасное поведение рядом с дорожным рабочим в рабочей зоне грозит штраф до 1000 долларов, штрафные баллы и, возможно, обязательное переобучение. Штрафы за телефон в руке в рабочей зоне удваиваются. Что делать: сбавьте скорость, выполняйте указания знаков и флагманов, перестраивайтесь заранее, увеличьте дистанцию, держитесь подальше от рабочих и техники, ночью будьте особенно осторожны. Бывают и подвижные работы (разметка, ямочный ремонт, покос), поэтому соблюдайте правила, пока не увидите знак «End Road Work». Страховка. На любую зарегистрированную в Коннектикуте машину нужна непрерывная страховка. Если страховку не продлили, страховая компания сообщит в DMV, и владельцу придёт уведомление: можно заключить соглашение (Insurance Compliance), показать полис и заплатить штраф. Если не ответить, регистрацию машины приостановят.',q:[
['Какого цвета временные знаки в рабочей зоне?',['Жёлтые','Оранжевые с чёрными буквами или символами','Красные','Зелёные'],1,'Все временные знаки в рабочих зонах имеют оранжевый фон и чёрные буквы или символы.'],
['В рабочей зоне нет знаков о снижении скорости. Какую скорость соблюдать?',['Любую','Обычное ограничение скорости','25 миль/ч','Ту, что у машины впереди'],1,'Если знаков о снижении скорости нет, действует обычное ограничение.'],
['Какой штраф может грозить за превышение скорости в рабочей зоне в Коннектикуте?',['До 100 долларов','До 500 долларов','До 1000 долларов','Штрафа нет'],2,'Штраф до 1000 долларов, штрафные баллы и, возможно, переобучение.'],
['Что происходит со штрафом за телефон в руке в рабочей зоне?',['Не меняется','Удваивается','Отменяется','Заменяется предупреждением'],1,'Штрафы за отвлечение (телефон в руке) в рабочей зоне удваиваются.'],
['До какого момента нужно соблюдать правила рабочей зоны?',['Пока не пропали рабочие','Пока не увидите знак «End Road Work»','Пока не пройдёт час','Пока не кончится разметка'],1,'Бывают подвижные работы, поэтому ориентируйтесь на знаки до знака «End Road Work».'],
['Что закон Коннектикута требует относительно страховки?',['Страховка нужна только на новую машину','Непрерывная страховка на любую зарегистрированную машину','Страховка нужна только по запросу','Только для молодых водителей'],1,'На зарегистрированную машину нужна непрерывная страховка.'],
['Страховка закончилась, пришло уведомление от DMV. Что будет, если не ответить?',['Ничего','Регистрацию машины приостановят','Права аннулируют сразу','Только предупреждение'],1,'Если не ответить, регистрацию приостановят. Ехать на такой машине нельзя.']]},
{n:'Пешеходы и уязвимые участники',t:'Закон об уязвимых участниках (Vulnerable User’s Law) предусматривает более высокие штрафы водителям, которые не проявили должной осторожности и причинили серьёзный вред или смерть уязвимому участнику. К ним относятся пешеходы, велосипедисты, пользователи инвалидных колясок, дорожные рабочие, люди верхом или с животным, а также почтовые и мусорные машины. При обгоне оставляйте не менее 3 футов. На каждом перекрёстке есть пешеходный переход, даже если он не размечен. Уступайте пешеходу, который уже на переходе, стоит у бордюра и поднял руку, или вошёл в переход любой частью тела или предметом (коляска, трость, велосипед, собака на поводке). Слепому пешеходу (белая трость, собака-поводырь) уступайте и стойте, пока он не выйдет с дороги, даже при зелёном. Рядом со школами, остановками, парками и детскими площадками будьте особенно внимательны: в школьной зоне соблюдайте сниженную скорость и уступайте детям или по сигналу регулировщика. Не открывайте дверь, если она может задеть пешехода или велосипедиста. Осторожно выезжайте из двора задним ходом.',q:[
['Где в Коннектикуте есть пешеходный переход?',['Только там, где нарисована «зебра»','На каждом перекрёстке, даже без разметки','Только у светофора','Только у школ'],1,'Переход есть на каждом перекрёстке, даже если его не отметили линиями.'],
['Пешеход стоит у бордюра и поднял руку, показывая, что хочет перейти. Что делать?',['Ехать, пока он не на дороге','Замедлиться или остановиться и уступить','Посигналить','Объехать'],1,'Уступите: поднятая рука или вход в переход любой частью тела или предметом означает намерение перейти.'],
['Слепой человек с белой тростью начал переходить дорогу. У вас зелёный. Что делать?',['Проехать быстро','Остановиться и оставаться на месте, пока он не сойдёт с дороги','Посигналить','Объехать сзади'],1,'Слепому пешеходу нужно уступить и ждать, пока он выйдет с дороги, даже если у вас зелёный.'],

['Кто относится к уязвимым участникам?',['Только пешеходы','Пешеходы, велосипедисты, пользователи колясок, дорожные рабочие и некоторые другие','Только дети','Только мотоциклисты'],1,'К уязвимым участникам относятся пешеходы, велосипедисты, люди в инвалидных колясках, рабочие и другие.'],
['Что нужно соблюдать в школьной зоне?',['Обычную скорость','Сниженную скорость и уступать детям','Сниженную скорость только при мигании огней','Ничего днём в выходные'],1,'Соблюдайте сниженный лимит и уступайте переходящим детям или по сигналу регулировщика. Дети бывают на дороге не только в учебные часы.']]},
{n:'Отвлечение и усталость',t:'Отвлекаться можно и в машине (телефон, настройка радио или навигатора, еда и питьё, макияж, разговоры с пассажирами, детьми и питомцами, поднятие упавшей вещи), и вне её (чужая авария, полиция, билборды, закат). Опасно не только занять глаза или руки, но и ум. Что помогает: настроить всё до поездки, пристегнуть детей, закрепить питомца в переноске, заранее выстроить маршрут, не надевать наушники. Если рядом едет отвлечённый водитель (виляет, меняет скорость, спорит с пассажиром), держите дистанцию 3–4 секунды и осторожно его обгоняйте. За отвлечение отвечаете вы, а не то, что вас отвлекло. Усталость, как и алкоголь, ухудшает зрение и суждение, замедляет решения и может привести к засыпанию за рулём. В группе риска люди 16–24 лет, люди с нелеченым апноэ сна (риск заснуть за рулём в 7 раз выше), работающие в ночную смену (риск почти в 6 раз выше) и те, кто работает больше 60 часов в неделю. Перед поездкой выспитесь (взрослым обычно нужно 7–9 часов), делайте перерыв примерно каждые 100 миль или 2 часа, найдите попутчика, избегайте алкоголя и снотворных лекарств.',q:[
['Что считается отвлечением за рулём?',['Только телефон','Телефон, радио, еда, макияж, разговоры и мысли, уводящие внимание от дороги','Только еда','Только чтение'],1,'Отвлечением считается всё, что занимает глаза, руки или ум.'],
['Кто отвечает, если вы отвлеклись и попали в аварию?',['Тот, кто вас отвлёк','Вы','Пассажир','Никто'],1,'За отвлечение отвечает водитель: вы полностью и единолично отвечаете за безопасное управление машиной.'],
['Рядом едет водитель, который виляет в своей полосе. Какую дистанцию держать?',['1 секунду','3–4 секунды и осторожно обгонять','Ехать вплотную','Посигналить и обогнать на скорости'],1,'Дайте ему больше места: он может не заметить вас и дрейфовать в вашу полосу.'],
['Сколько сна нужно большинству взрослых для бодрости днём?',['3–4 часа','5–6 часов','7–9 часов','10–12 часов'],2,'Обычно 7–9 часов.'],
['Как часто нужно делать перерыв в долгой поездке?',['Раз в 5 часов','Примерно каждые 100 миль или 2 часа','Только когда очень устали','Не нужно'],1,'Примерно каждые 100 миль или 2 часа.'],
['Чем опасна усталость за рулём?',['Только скоростью','Как и алкоголь, ухудшает зрение, суждение и скорость решений, можно заснуть за рулём','Ничем','Влияет только на слух'],1,'Усталость ухудшает зрение, суждение и скорость реакции.']]});
RT.push(
{n:'Трассы: въезд, слияние, выезд',t:'Въезжая на скоростную дорогу, разгоняйтесь по въездной рампе (on-ramp) до скорости потока: для этого она и нужна. Не доезжайте до конца рампы и не останавливайтесь: сзади вас не ждут остановки, и вам не хватит места для разгона. Если нужно подождать просвет, притормозите заранее на рампе, чтобы осталось место для разгона. Для слияния нужен просвет примерно в 4 секунды: это нужно и при смене полосы, и при въезде на дорогу, и когда ваша полоса сливается с другой. Если вы въехали в середину такого просвета, у вас и у машины сзади будет по 2 секунды дистанции. Не вливайтесь в слишком маленький просвет и никогда не пересекайте с рампы сразу несколько полос. Держите скорость потока: аварии часто случаются из-за разницы скоростей, а превышение скорости экономит всего несколько минут в час. Съезжая с трассы, не тормозите на самой дороге, а сбрасывайте скорость уже на съезде. На дороге с двумя и более полосами в вашем направлении езжайте по правой, кроме обгона; при трёх и более полосах используйте среднюю, если много въезжающих и съезжающих. По обочине ехать нельзя, если не указали иначе представители власти. На скоростной дороге (expressway) разворачиваться нельзя. Даже на зелёном не въезжайте на перекрёсток, если за ним нет места: за блокировку перекрёстка можно получить штраф. Не считайте, что встречная машина с включённым поворотником повернёт: подождите, пока водитель действительно начнёт поворот.',q:[
['Как нужно ехать по въездной рампе (on-ramp) при въезде на скоростную дорогу?',['Разогнаться до скорости потока','Остановиться в конце рампы','Ехать медленнее потока','Сразу пересечь все полосы'],0,'Рампа нужна, чтобы набрать скорость потока до въезда на дорогу.'],
['Какой просвет нужен для слияния и смены полосы?',['Около 1 секунды','Около 2 секунд','Около 4 секунд','Просвет не нужен'],2,'Нужен просвет около 4 секунд: тогда и у вас, и у машины сзади будет по 2 секунды дистанции.'],
['Почему нельзя останавливаться в конце рампы?',['Это разрешено','Нет места для разгона, а водители сзади не ждут остановки','Там нельзя включать поворотник','Так требует знак'],1,'Вам не хватит места набрать скорость, и в вас могут въехать сзади.'],
['Вы на дороге с двумя полосами в вашем направлении и никого не обгоняете. Какую полосу занять?',['Левую','Правую','Любую','Обочину'],1,'На дороге с двумя и более полосами в одном направлении езжайте по правой, кроме обгона.'],
['Можно ли разворачиваться на скоростной дороге (expressway)?',['Да','Нет, никогда','Да, ночью','Да, на съезде'],1,'Разворот на скоростной дороге делать нельзя.'],
['Горит зелёный, но за перекрёстком затор. Что делать?',['Въехать и ждать','Не въезжать, пока не освободится место: за блокировку перекрёстка можно получить штраф','Посигналить','Включить аварийку'],1,'Не въезжайте на перекрёсток, если не сможете выехать из него.'],
['Как правильно съезжать с трассы?',['Сбросить скорость заранее на самой трассе','Сохранять скорость потока и сбрасывать её уже на съезде','Резко затормозить перед съездом','Съехать по обочине'],1,'Пока вы на основной дороге, держите скорость потока и тормозите только на съезде.'],
['У встречной машины мигает поворотник. Можно ли сразу поворачивать?',['Да','Нет: подождите, пока водитель действительно начнёт поворот','Да, ночью','Да, если посигналить'],1,'Поворотник может остаться включённым после прошлого поворота, особенно у мотоциклов.']]},
{n:'Агрессивное вождение',t:'Агрессивное вождение может перейти в «дорожную ярость» (road rage). Не соревнуйтесь на дороге, пропускайте тех, кто торопится, не отвечайте на агрессию и, если нужно, сообщите о ней в полицию по прибытии. Что может спровоцировать конфликт: блокировка левой (обгонной) полосы, езда вплотную, смена полосы без сигнала и «подрезание», резкие жесты, лишний клаксон (если нужно привлечь внимание, нажмите легко), езда в правой полосе, когда вы не поворачиваете направо, парковка на двух местах или на месте для людей с инвалидностью без разрешения, ответ дальним светом на дальний, дальний свет сзади идущей машине, а также блокировка дороги ради разговора с пешеходом. Если за вами гонится агрессивный водитель: не смотрите ему в глаза, не отвечайте, не езжайте домой, а езжайте в полицию или людное освещённое место. Если вы разозлены, отложите поездку или попросите кого-то отвезти.',q:[
['Какую полосу многополосной дороги нельзя блокировать медленной ездой?',['Правую','Крайнюю левую (для обгона)','Любую','Обочину'],1,'Не занимайте крайнюю левую полосу, пропускайте тех, кто хочет обогнать.'],
['За вами гонится агрессивный водитель. Что делать?',['Поехать домой','Не смотреть ему в глаза и ехать в полицию или в людное освещённое место','Затормозить и выйти','Ответить жестом'],1,'Зрительный контакт можно принять за вызов. Домой ехать не нужно.'],
['Как лучше привлечь внимание другого водителя клаксоном в обычной ситуации?',['Долго и громко','Легко нажать','Нельзя никогда','Посигналить сразу, как загорелся зелёный'],1,'Клаксон нужно использовать редко и легко. Резкий сигнал может спровоцировать агрессию.'],
['Встречная машина едет с дальним светом. Можно ли «проучить» её своим дальним?',['Да','Нет, отвечать дальним на дальний нельзя','Да, ночью','Да, если дорога пустая'],1,'Не отвечайте дальним светом, это опасно для обоих.'],
['Вы злы и не можете успокоиться. Что лучше сделать?',['Ехать быстрее','Отложить поездку или попросить кого-то отвезти','Выехать на трассу, чтобы остыть','Включить громкую музыку'],1,'Если вы раздражены, лучше отложить поездку или попросить друга отвезти вас.'],
['Куда сообщить об агрессивном водителе?',['Никуда','В полицию, когда вы приедете на место','Ему лично','В автошколу'],1,'Лучше оставить наказание полиции: сообщите о случае по прибытии.']]});
RT.push(
{n:'Вопросы из учебника (Study Questions)',t:'В самом учебнике Коннектикута есть 10 контрольных вопросов (Study Questions), ответы на них напечатаны в конце книги. Это самые близкие к настоящему экзамену формулировки, поэтому их стоит знать наизусть. Здесь они переведены на русский в том же порядке, что и в учебнике, с теми же вариантами ответов.',q:[
['Изношенные шины могут привести к:',['Затруднённым поворотам','Аквапланированию (hydroplaning)','Увеличению тормозного пути','Всему перечисленному'],3,'Изношенные шины хуже держат дорогу: поворачивать сложнее, выше риск аквапланирования, а тормозной путь длиннее. Верно всё перечисленное.'],

if(!rp){R[id]=r?1:0;sr();save();tabs();(S.res=S.res||{})[S.i]=k;(S.rr=S.rr||{})[S.i]=r?1:0}
if(S.ex){S.i++;return quiz()}
app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const n=+b.dataset.k;b.style.outline='';const c=q.m?q.m.includes(n):n==q[2],p=q.m?k.includes(n):n==k;if(c)b.classList.add('ok');else if(p)b.classList.add('bad');if(q.m)b.insertAdjacentHTML('afterbegin',c&&p?'<b>✓ верно: </b>':p?'<b>✗ лишний: </b>':c?'<b>! пропущен: </b>':'')});
const ni=document.getElementById('ni');if(ni){ni.disabled=true;ni.value=k;document.getElementById('nb').disabled=true}const im=QI[id]!=null?`<img class="qi" src="${SG[QI[id]][0]}" alt="" style="margin-top:12px">`:'';
document.getElementById('fb').innerHTML=`<p class="exp"><b>${r?'Верно.':'Неверно.'}</b> ${q[3]}</p>${im}${TO[id]!=null?`<button class="opt" onclick="gv(${TO[id]})">Где об этом в теории</button>`:''}<button class="opt" id="un">Не уверена — повторить позже</button><button class="go" id="nx">Дальше</button>`;
document.getElementById('un').onclick=e=>{if(!W.includes(id)){W.push(id);save();tabs()}bump(id);e.target.textContent='Добавлено в «Повторить»';e.target.disabled=true};
document.getElementById('nx').onclick=()=>{S.i++;quiz()}}
function done(){if(S.ex&&S.key&&!S.rec){S.rec=1;EH.push([Date.now(),S.ok,S.ids.length]);EH=EH.slice(-30);try{localStorage.setItem('eh',JSON.stringify(EH))}catch(e){}}if(S.key){delete SV[S.key];ss()}const n=S.ids.length,pass=S.ok>=20;
let h=`<p class="big">${S.ok} из ${n}</p>`;
if(S.ex)h+=`<h2>${pass?'Сдано! Нужно было 20.':'Не сдано. Нужно 20 верных.'}</h2>`;
else h+='<h2>Серия закончена</h2>';
if(S.miss.length)h+='<p class="mute">Разбор ошибок (✓ верный ответ, ✗ ваш ответ):</p>'+S.miss.map(id=>{const q=Q[id],pk=(S.pick||{})[id],im=q[4]||(QI[id]!=null?SG[QI[id]][0]:'');return `<div class="exp">${im?`<img class="qi" src="${im}" alt="" style="width:80px;height:80px;margin:0 0 8px">`:''}<b>${q[0]}</b>`+q[1].map((o,k)=>{const c=q.m?q.m.includes(k):k==q[2],w=q.m?(pk||[]).includes(k):k==pk;return `<div style="margin:6px 0;padding:8px 10px;border-radius:8px;border:1.5px solid ${c?'var(--okb)':w?'var(--badb)':'var(--line)'};background:${c?'var(--ok)':w?'var(--bad)':'transparent'}">${c?'✓ ':w?'✗ ':''}${o}</div>`}).join('')+`<span class="mute" style="display:block;margin-top:6px">${q[3]}</span></div><br>`}).join('');
if(S.g!=null&&!S.mode&&S.ok>=n-1&&!D.includes(S.g)){D.push(S.g);try{localStorage.setItem('d',JSON.stringify(D))}catch(e){}}
h+=S.mode?`<button class="go" onclick="tmode(${S.g},'${S.mode}')">Ещё раз</button><button class="opt" style="margin-top:8px" onclick="tm(${S.g})">К теме</button>`:S.g!=null?`<button class="go" onclick="gq(${S.g})">Ещё раз</button><button class="opt" style="margin-top:8px" onclick="go('sign')">К темам</button>`:`<button class="go" onclick="go('${S.ex?'exam':'prac'}')">Ещё раз</button>`;
app.innerHTML=h;tabs()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
go('home');
</script></body></html>
